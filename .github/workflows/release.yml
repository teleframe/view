name: Release & Publish

on:
    push:
        branches:
            - main
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            dry_run:
                description: 'Dry run publication (do not publish to registries)'
                type: boolean
                default: false

permissions:
    contents: write
    pull-requests: write
    id-token: write

jobs:
    release-please:
        name: Automated Versioning & Release PR (Release Please)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        outputs:
            releases_created: ${{ steps.release.outputs.releases_created || steps.release.outputs['.--release_created'] }}
            tag_name: ${{ steps.release.outputs.tag_name || steps.release.outputs['.--tag_name'] }}
            version: ${{ steps.release.outputs.version || steps.release.outputs['.--version'] }}
        steps:
            - name: Run Release Please
              id: release
              uses: googleapis/release-please-action@v4
              with:
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    publish:
        name: Publish to NPM & JSR
        needs: release-please
        if: ${{ always() && (needs.release-please.result == 'success' || needs.release-please.result == 'skipped') && (needs.release-please.outputs.releases_created == 'true' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ needs.release-please.outputs.tag_name || github.ref }}

            - name: Setup tools with mise
              uses: jdx/mise-action@v2
              with:
                  cache: true

            - name: Configure NPM registry credentials
              run: echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > ~/.npmrc

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Validate Tag & Manifest Versions
              run: |
                  TAG="${{ needs.release-please.outputs.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}"
                  if [ -n "$TAG" ]; then
                    export GITHUB_REF_NAME="$TAG"
                  fi

                  PKG_VERSION=$(node -p "require('./package.json').version")
                  DENO_VERSION=$(node -p "require('./deno.json').version")
                  NATIVE_VERSION=$(node -p "require('./packages/native/package.json').version")
                  MANIFEST_VERSION=$(node -p "require('./.release-please-manifest.json')['.']")

                  echo "Target Tag:          ${TAG:-None (manual run)}"
                  echo "package.json:        $PKG_VERSION"
                  echo "deno.json:           $DENO_VERSION"
                  echo "packages/native:     $NATIVE_VERSION"
                  echo "manifest:            $MANIFEST_VERSION"

                  if [ "$PKG_VERSION" != "$DENO_VERSION" ]; then
                    echo "::error::package.json version ($PKG_VERSION) does not match deno.json ($DENO_VERSION)"
                    exit 1
                  fi

                  if [ "$PKG_VERSION" != "$NATIVE_VERSION" ]; then
                    echo "::error::package.json version ($PKG_VERSION) does not match packages/native ($NATIVE_VERSION)"
                    exit 1
                  fi

                  if [ "$PKG_VERSION" != "$MANIFEST_VERSION" ]; then
                    echo "::error::package.json version ($PKG_VERSION) does not match .release-please-manifest.json ($MANIFEST_VERSION)"
                    exit 1
                  fi

                  if [ -n "$TAG" ] && [ "$TAG" != "v$PKG_VERSION" ]; then
                    echo "::error::Target Tag ($TAG) does not match package.json version (v$PKG_VERSION)"
                    exit 1
                  fi

            - name: Verify release readiness
              run: bun run verify:release
              env:
                  GITHUB_REF_NAME: ${{ needs.release-please.outputs.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}

            - name: Build production artifacts
              run: bun run build

            # 1. Publish to NPM
            - name: Publish to NPM
              if: ${{ !inputs.dry_run }}
              run: npm publish --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish to NPM (Dry Run)
              if: ${{ inputs.dry_run }}
              run: npm publish --dry-run --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            # 2. Publish to JSR
            - name: Publish to JSR
              if: ${{ !inputs.dry_run }}
              run: deno publish

            - name: Publish to JSR (Dry Run)
              if: ${{ inputs.dry_run }}
              run: deno publish --dry-run

            # 3. Create Fallback GitHub Release (only for manual tag push without Release Please)
            - name: Create Fallback GitHub Release
              if: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run && needs.release-please.outputs.releases_created != 'true' }}
              uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
                  draft: false
                  prerelease: false
